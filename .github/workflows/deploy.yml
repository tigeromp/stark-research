name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/add-pwa-support-c355
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        env:
          # Anon key is public; keep deploy working even without repo secrets
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://tntwkojcrbvoryhxmttp.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRudHdrb2pjcmJ2b3J5aHhtdHRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5ODc3MzQsImV4cCI6MjA5OTU2MzczNH0.w3BawXHjUlP34BMFMTRE6qBo4kOrPT9Xyhn4uIc1IGc' }}
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
